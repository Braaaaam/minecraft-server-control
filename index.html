
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Server Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171923;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            background: #242938;
            padding: 35px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 35px #0005;
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        p {
            color: #aeb8c9;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border: 1px solid #444d60;
            border-radius: 8px;
            background: #171923;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #269b52;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #31b963;
        }

        button:disabled {
            background: #555;
            cursor: wait;
        }

        #status {
            margin-top: 20px;
            min-height: 24px;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #788397;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⛏ Minecraft Server</h1>

    <p>Remote server control panel</p>

    <form id="wakeForm">

        <input
            type="password"
            id="password"
            placeholder="Access password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="wakeButton">
            START SERVER
        </button>

    </form>

    <div id="status"></div>

    <div class="footer">
        Powered by Raspberry Pi Pico W
    </div>

</div>

<script>

const API_URL =
    "https://oioyrusgfrfbrqbvvtnm.supabase.co/functions/v1/REQUEST-WAKE";

const form = document.getElementById("wakeForm");
const button = document.getElementById("wakeButton");
const status = document.getElementById("status");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "SENDING REQUEST...";
    status.textContent = "Contacting your home server...";

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                password: password
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Request failed");
        }

        status.textContent = "✓ Wake-up request sent!";
        status.style.color = "#4ade80";

        document.getElementById("password").value = "";

    } catch (error) {

        status.textContent = "✗ " + error.message;
        status.style.color = "#f87171";

    } finally {

        button.disabled = false;
        button.textContent = "⚡ START SERVER";

    }

});

</script>

</body>
</html>
